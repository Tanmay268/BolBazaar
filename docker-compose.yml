# Local PostgreSQL for development: `docker compose up -d db`
# Then set in .env:  DATABASE_URL=postgresql+psycopg://bolbazaar:bolbazaar@localhost:5432/bolbazaar
services:
  db:
    image: postgres:16-alpine
    container_name: bolbazaar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bolbazaar
      POSTGRES_PASSWORD: bolbazaar
      POSTGRES_DB: bolbazaar
    ports:
      - "5432:5432"
    volumes:
      - bolbazaar-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolbazaar -d bolbazaar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bolbazaar-pgdata:
