[project]
name = "fieldforce"
version = "0.1.0"
description = "FieldForce AI backend: voice-first visit, order and commitment capture"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "rapidfuzz>=3.9",
  "pyjwt>=2.8",
  "tzdata",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
fieldforce-api = "fieldforce.main:run"
fieldforce-seed = "fieldforce.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldforce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
